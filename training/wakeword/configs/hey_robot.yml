# openWakeWord train.py config for "hey robot" (see ../README.md)
model_name: hey_robot
target_phrase:
  - "hey robot"
  - "robot"   # the name alone too (add_word.py adds its clips)
custom_negative_phrases:
  - "hey rob"
  - "hey robert"
  - "hey roberta"
  - "hey rabbit"
  - "hey robin"
  - "hey roebuck"
  - "hey bob"
  - "hey row boat"
  - "hey jarvis"
  - "hey"
n_samples: 15000   # negatives regenerated without the name; the 30000 positives stay
n_samples_val: 3000
tts_batch_size: 32
augmentation_batch_size: 16
piper_sample_generator_path: /src
output_dir: /data/runs
rir_paths:
  - /data/rirs
  - /data/rirs_far   # make_far_rirs.py: across a room, mic near the floor
background_paths:
  - /data/background
background_paths_duplication_rate:
  - 1
false_positive_validation_data_path: /data/features/validation_set_features.npy
augmentation_rounds: 1
feature_data_files:
  ACAV100M_sample: /data/features/openwakeword_features_ACAV100M_2000_hrs_16bit.npy
  espeak_negative: /data/features/espeak_negative_features.npy
batch_n_per_class:
  ACAV100M_sample: 1024
  espeak_negative: 100
  adversarial_negative: 50
  positive: 150   # r2 (r1: 100, too strict: FA 0, recall low)
model_type: dnn
layer_size: 64
steps: 50000
max_negative_weight: 500   # r2 (r1: 1000)
target_false_positives_per_hour: 0.5   # r2 (r1: 0.3)
