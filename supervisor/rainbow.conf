; Rainbow's services. Copied into /etc/supervisor/conf.d by the Dockerfile.
;
;   supervisorctl status
;   supervisorctl stop rainbow_navigation
;   supervisorctl start rainbow_navigation
;
; To turn a part off permanently, set autostart=false on it.
; Launch arguments can be added to a command, e.g. base.launch.py tof:=false

; The agent is its own program so restarting the base does not drop the ESP.
; Our firmware reconnects by itself (~10 s) when the agent restarts; the stock
; Yahboom firmware needed a board reset (battery off/on).
[program:rainbow_microros]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh microros.launch.py
priority=0
stopasgroup=true
killasgroup=true

[program:rainbow_base]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh base.launch.py
priority=1
stopasgroup=true
killasgroup=true

; The ToF on its own: restarting it does not jump the odometry under SLAM
[program:rainbow_tof]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh tof.launch.py
priority=2
stopasgroup=true
killasgroup=true

; The head on its own too: restarting it to tune it does not touch the EKF
[program:rainbow_head]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh head.launch.py
priority=2
stopasgroup=true
killasgroup=true

; Localization on the saved map (map_server + AMCL). For mapping a new place,
; run rainbow_slam instead, never both (both publish map -> odom):
;   supervisorctl stop rainbow_localization; supervisorctl start rainbow_slam
[program:rainbow_localization]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh localization.launch.py
priority=2
stopasgroup=true
killasgroup=true

[program:rainbow_slam]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh slam.launch.py
priority=2
autostart=false
stopasgroup=true
killasgroup=true

[program:rainbow_navigation]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh navigation.launch.py
priority=3
stopasgroup=true
killasgroup=true

[program:rainbow_foxglove]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh foxglove.launch.py
; Off since 2026-11-28: the phone remote (rainbow_web) replaces it. To use
; Foxglove: supervisorctl start rainbow_foxglove (or autostart=true again)
autostart=false
priority=4
stopasgroup=true
killasgroup=true

[program:rainbow_voice]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh voice.launch.py
priority=4
stopasgroup=true
killasgroup=true

; The local brain (docs/brain.md): skills, places. Restarting it is safe.
[program:rainbow_brain]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh brain.launch.py
priority=5
stopasgroup=true
killasgroup=true

; The phone remote: http://rainbow.local/ (port 80). Restarting it is safe.
[program:rainbow_web]
command=/workspaces/Robot_Pi_4WD_ROS/scripts/rainbow_launch.sh web.launch.py
priority=5
stopasgroup=true
killasgroup=true
