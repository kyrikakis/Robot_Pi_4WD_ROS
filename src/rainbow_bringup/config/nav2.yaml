# Nav2 for Rainbow: a small skid-steer robot (about 19 x 14 cm) in a house.
#
# Tuned for tight spaces:
#   - real polygon footprint instead of a 12 cm radius (+3 cm padding)
#   - thin, steep inflation so doorways and gaps stay cheap away from walls
#   - MPPI controller (differential drive, can reverse out of dead ends)
#     instead of DWB with the rotation shim
#   - Smac 2D planner, cost aware, may plan through unknown space
#   - progress checker that accepts slow, turning progress
#
# Velocity output: velocity_smoother -> collision_monitor -> cmd_vel_stamped
# -> rainbow_drivers cmd_vel_watchdog -> cmd_vel (ESP board).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # ms to wait for a server to acknowledge a request; 20 (the default) timed
    # out on the busy Pi and aborted goals while re-planning
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Nav2's default trees minus the BackUp recovery (recoveries: clear costmaps,
    # spin, wait): nothing sees low obstacles behind the robot
    default_nav_to_pose_bt_xml: /workspaces/Robot_Pi_4WD_ROS/install/rainbow_bringup/share/rainbow_bringup/behavior_trees/navigate_to_pose_no_backup.xml
    default_nav_through_poses_bt_xml: /workspaces/Robot_Pi_4WD_ROS/install/rainbow_bringup/share/rainbow_bringup/behavior_trees/navigate_through_poses_no_backup.xml
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # MPPI only reached 10-16 Hz at 20 on the Pi; 15 is plenty for 0.26 m/s
    controller_frequency: 15.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Was 0.5 m in 10 s: in a small room the robot often turns and creeps
    # for longer than that, which Nav2 read as "stuck".
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "DiffDrive"
      # model_dt must be >= the control period (1/15 s); 40 x 0.07 s keeps the
      # 2.8 s look-ahead of the default 56 x 0.05 s, with fewer steps to compute
      time_steps: 40
      model_dt: 0.07
      batch_size: 600           # 2000 is the default; 1000 still missed 15 Hz on the Pi
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.8               # sample faster turns; 0.4 rarely tried them
      vx_max: 0.26
      vx_min: 0.0               # no reversing: nothing sees low obstacles behind
      vy_max: 0.0
      wz_max: 1.5               # rad/s; 1.0 made turns and corrections slow
      ax_max: 2.0
      ax_min: -2.0
      ay_max: 0.0
      az_max: 3.2
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.0
      transform_tolerance: 0.2
      enforce_path_inversion: false
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.4
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.4
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.4

# Both costmaps use the same layers; keep them in sync when tuning.
#   footprint:       in base_link, from rainbow_description: chassis and
#                    wheels 19 x 14 cm, head reaching 10 cm ahead of centre
#   obstacle_layer:  lidar scan
#   voxel_layer:     ToF point cloud, for obstacles below the lidar's scan
#                    plane (15.7 cm)
#   inflation_layer: thin and steep, so only cells right next to obstacles
#                    get expensive and narrow gaps the robot fits stay usable
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.10, 0.07], [0.10, -0.07], [-0.09, -0.07], [-0.09, 0.07]]"
      footprint_padding: 0.01
      resolution: 0.02
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
        subscribe_to_updates: true
        transform_tolerance: 0.1
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1
        scan:
          topic: /scan
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
      voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        # Same as the local costmap: cleared when seen empty, fades after 30 s out of view
        voxel_decay: 30.0
        decay_model: 0
        voxel_size: 0.02              # match the costmap resolution
        track_unknown_space: true
        observation_persistence: 0.0
        max_obstacle_height: 0.16
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud_mark pointcloud_clear
        pointcloud_mark:
          data_type: PointCloud2
          topic: /point_cloud
          marking: true
          clearing: false
          obstacle_range: 1.0
          min_obstacle_height: 0.03   # floor-aware, from the calibrated floor
          max_obstacle_height: 0.16   # below the robot top; taller things pass overhead
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 3         # ignore isolated noisy points
          clear_after_reading: true
        pointcloud_clear:             # was referenced as pointcloud_Clear, so it never loaded
          data_type: PointCloud2
          topic: /point_cloud
          marking: false
          clearing: true
          max_z: 1.5
          min_z: 0.3                  # do not clear from uncertain close-up readings
          # ~10% narrower than the calibrated 48.5 x 39.3 deg, so the uncertain
          # image edges never clear remembered obstacles
          vertical_fov_angle: 0.62      # 35.5 deg
          horizontal_fov_angle: 0.76    # 43.5 deg
          decay_acceleration: 1.0
          model_type: 0                 # depth camera frustum
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Planner's view: keeps paths off walls in open space, but narrow enough that
        # gaps a little wider than the robot still look passable (0.45 / 3 was too wide)
        inflation_radius: 0.30
        cost_scaling_factor: 5.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      # 10 Hz is plenty for the lidar; it shares the controller's process
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.02
      footprint: "[[0.10, 0.07], [0.10, -0.07], [-0.09, -0.07], [-0.09, 0.07]]"
      footprint_padding: 0.01
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1
        scan:
          topic: /scan
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: false
      voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        # Voxels the ToF can see are cleared as soon as the spot is empty; voxels out
        # of its view (the blind zone in front of the nose, beside the robot) fade
        # after 30 s: long enough to pass a low obstacle, short enough that a hand
        # seen while placing something does not stay as a phantom
        voxel_decay: 30.0
        decay_model: 0
        voxel_size: 0.02              # match the costmap resolution
        track_unknown_space: true
        observation_persistence: 0.0
        max_obstacle_height: 0.16
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud_mark pointcloud_clear
        pointcloud_mark:
          data_type: PointCloud2
          topic: /point_cloud
          marking: true
          clearing: false
          obstacle_range: 1.0
          # Floor-aware: the calibrated floor reads within ~1-2 cm to 1 m, so points
          # 3 cm above it are obstacles (scripts/calibrate_tof.py)
          min_obstacle_height: 0.03
          max_obstacle_height: 0.16   # below the robot top; taller things pass overhead
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 3         # ignore isolated noisy points
          clear_after_reading: true
        pointcloud_clear:             # was referenced as pointcloud_Clear, so it never loaded
          data_type: PointCloud2
          topic: /point_cloud
          marking: false
          clearing: true
          # Clear only where the data is reliable: 0.1-1.5 m along the view
          max_z: 1.5
          min_z: 0.3                  # do not clear from uncertain close-up readings
          # ~10% narrower than the calibrated 48.5 x 39.3 deg, so the uncertain
          # image edges never clear remembered obstacles
          vertical_fov_angle: 0.62      # 35.5 deg
          horizontal_fov_angle: 0.76    # 43.5 deg
          decay_acceleration: 1.0
          model_type: 0                 # depth camera frustum
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Controller's view: thin and steep, so it can drive through tight gaps
        inflation_radius: 0.18
        cost_scaling_factor: 8.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.15
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      cost_travel_multiplier: 2.0   # prefer the middle of corridors and doorways
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Same limits as the MPPI controller
    max_velocity: [0.26, 0.0, 1.5]
    min_velocity: [0.0, 0.0, -1.5]
    max_accel: [2.0, 0.0, 3.2]
    max_decel: [-2.0, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_stamped"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: False
    stop_pub_timeout: 2.0
    # Present but disabled: the monitor passes commands straight through.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: False
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: False

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "/local_costmap/costmap_raw"
      footprint_topic: "/local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
