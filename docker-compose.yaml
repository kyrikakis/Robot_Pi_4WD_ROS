services:
  robot:
    container_name: robot
    build: .
    network_mode: "host"
    ipc: host
    pid: host
    devices:
      - /dev:/dev
    volumes:
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /run/udev/
        target: /run/udev/
      - type: bind
        source: /boot/firmware
        target: /boot/firmware
        read_only: false
      # Data the robot writes at runtime (places, later the link token): survives
      # image rebuilds; created by docker compose. Never code (docs/brain.md).
      - type: volume
        source: rainbow_data
        target: /data/rainbow

    cap_add: 
      - SYS_ADMIN
    privileged: true
    restart: always

volumes:
  rainbow_data:
